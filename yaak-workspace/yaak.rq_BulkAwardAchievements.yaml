body:
  query: |
    mutation BulkAwardAchievements($teamId: ID!, $achievementId: ID!) {
      bulkAwardAchievements(teamId: $teamId, achievementId: $achievementId) {
        id
        name
        points
        achievedAt
        ... on SimpleAchievement {
          project {
            id
            name
          }
        }
        ... on ContentAchievement {
          totalItems
          completedItemCount
          project {
            id
            name
          }
        }
        ... on StreakAchievement {
          neededStreak
          project {
            id
            name
          }
        }
      }
    }
  variables: |
    {
      "teamId": "TM01EXAMPLE00000000000000000",
      "achievementId": "AC01EXAMPLE00000000000000000"
    }
bodyType: graphql
description: Award an achievement to all members of a team (M2M/admin only)
