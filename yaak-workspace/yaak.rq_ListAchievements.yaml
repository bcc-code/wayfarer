body:
  query: |
    query ListAchievements($filter: AchievementFilter!, $first: Int, $after: String) {
      achievements(filter: $filter, first: $first, after: $after) {
        edges {
          node {
            id
            name
            points
            hidden
            achievedAt
            ... on SimpleAchievement {
              project {
                id
                name
              }
            }
            ... on ContentAchievement {
              totalItems
              completedItemCount
              project {
                id
                name
              }
            }
            ... on StreakAchievement {
              neededStreak
              project {
                id
                name
              }
            }
            ... on QuizAchievement {
              minScorePercentage
              project {
                id
                name
              }
            }
          }
        }
        pageInfo {
          hasNextPage
          hasPreviousPage
          startCursor
          endCursor
        }
        totalCount
      }
    }
  variables: |
    {
      "filter": {
        "projectId": "PR01K9W1Y51ARG5DCHJXR9VW8DKN"
      },
      "first": 20
    }
