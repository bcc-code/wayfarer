body:
  query: |
    mutation AddQuizQuestion($quizId: ID!, $input: CreateQuizQuestionInput!) {
      addQuizQuestion(quizId: $quizId, input: $input) {
        id
        questionText
        questionOrder
        timeoutSeconds
        ... on NumberQuestion {
          minValue
          maxValue
          stepValue
        }
      }
    }
