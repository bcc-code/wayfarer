body:
  operationName: TestNearestChurchRivals
  query: |
    query TestNearestChurchRivals($projectId: ID!) {
      project(id: $projectId) {
        id
        name
        leaderboard(entityType: PERSONS, first: 20) {
          me {
            name
            rank
            score
          }
          nearestChurchRivals(first: 5) {
            name
            rank
            score
            description
          }
        }
      }
    }
  variables: |-
    {
      "projectId": "PR01K9VZ8684DP9R4W3ZEV526E5X"
    }
bodyType: graphql
description: 'Uses project(id) instead of currentProject so it does not depend on the global current_project_id setting. Default projectId has real same-church data for testing rivals - swap the TOKEN env var to the user whose rivals you want to see.'
