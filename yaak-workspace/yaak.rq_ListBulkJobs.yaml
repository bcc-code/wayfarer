body:
  query: |
    query ListBulkJobs($filter: BulkJobFilter, $first: Int, $after: String) {
      bulkJobs(filter: $filter, first: $first, after: $after) {
        edges {
          cursor
          node {
            id
            operationType
            status
            totalCount
            processedCount
            successCount
            failureCount
            errorMessage
            createdAt
            startedAt
            completedAt
          }
        }
        pageInfo {
          hasNextPage
          hasPreviousPage
          startCursor
          endCursor
        }
        totalCount
      }
    }
  variables: |
    {
      "filter": {
        "status": "PENDING"
      },
      "first": 20
    }
bodyType: graphql
description: List all bulk jobs with filters (Admin only)
