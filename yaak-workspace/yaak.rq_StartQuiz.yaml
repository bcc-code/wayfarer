body:
  query: |
    mutation StartQuiz($quizId: ID!) {
      startQuiz(quizId: $quizId) {
        id
        startedAt
        expiresAt
        isExpired
        questionOrder
        orderedQuestions {
          id
          questionType
          questionText
          questionOrder
          allowMultipleSelection
          predefinedAnswers {
            id
            answerText
            answerOrder
          }
          minValue
          maxValue
          stepValue
        }
        quiz {
          id
          name
          timeoutSeconds
          questionTimeoutSeconds
        }
      }
    }
