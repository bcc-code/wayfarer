body:
  query: |
    mutation StartQuiz($quizId: ID!) {
      startQuiz(quizId: $quizId) {
        id
        startedAt
        expiresAt
        isExpired
        questionOrder
        orderedQuestions {
          id
          questionText
          questionOrder
          timeoutSeconds
          ... on PredefinedQuestion {
            allowMultipleSelection
            predefinedAnswers {
              id
              answerText
              answerOrder
            }
          }
          ... on NumberQuestion {
            minValue
            maxValue
            stepValue
          }
        }
        quiz {
          id
          name
          timeoutSeconds
        }
      }
    }
  variables: |
    {
      "quizId": "QZ01KC1SR8V7JC7F1Q7RCYD946HD"
    }
