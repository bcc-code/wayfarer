body:
  query: |
    query ScoreJournal {
      myCurrentProject {
        journal(first: 100) {
          edges {
            node {
              id
              sourceType
              source {
                __typename
                ... on Achievement {
                  id
                  name
                }
                ... on Challenge {
                  id
                  name
                }
                ... on Event {
                  id
                  name
                }
              }
              points
              createdAt
              reason
            }
          }
        }
      }
    }
  variables: ''
