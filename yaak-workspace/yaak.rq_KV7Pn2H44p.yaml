body:
  query: |
    query ScoreJournal {
      myCurrentProject {
        journal {
          edges {
            node {
              id
              sourceType
              reason
              source {
                __typename
                ... on Achievement {
                  id
                  name
                }
                ... on Challenge {
                  id
                  name
                }
                ... on Event {
                  id
                  name
                }
                ... on SimpleAchievement {
                  id
                  name
                }
                ... on ReadingAchievement {
                  id
                  name
                }
                ... on ListeningAchievement {
                  id
                  name
                }
                ... on StreakAchievement {
                  id
                  name
                }
              }
              points
              createdAt
            }
          }
        }
      }
    }
  variables: ''
