body:
  query: |
    mutation CreateQuizSubmission(
      $quizId: ID!
      $userId: ID!
      $responses: [SubmitQuizAnswerInput!]!
      $completedAt: DateTime
    ) {
      createQuizSubmission(
        quizId: $quizId
        userId: $userId
        responses: $responses
        completedAt: $completedAt
      ) {
        id
        startedAt
        completedAt
        score
        maxScore
        scorePercentage
        pointsAwarded
        user {
          id
          name
        }
        responses {
          id
          question {
            id
            questionText
          }
          selectedAnswerIds
          textResponse
          numberResponse
          isCorrect
        }
      }
    }
