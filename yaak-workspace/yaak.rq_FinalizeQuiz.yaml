body:
  query: |
    mutation FinalizeQuiz($submissionId: ID!) {
      finalizeQuiz(submissionId: $submissionId) {
        id
        startedAt
        completedAt
        score
        maxScore
        scorePercentage
        pointsAwarded
        responses {
          id
          answeredAt
          timeSpentSeconds
          question {
            id
            questionText
          }
          ... on PredefinedResponse {
            selectedAnswerIds
            selectedAnswers {
              id
              answerText
              isCorrect
            }
            isCorrect
            pointsEarned
          }
          ... on FreeTextResponse {
            textResponse
            pointsEarned
          }
          ... on NumberResponse {
            numberResponse
            pointsEarned
          }
        }
      }
    }
  variables: |
    {
      "submissionId": "QS01KBZXB9XAGZZ38CRCXHDQE192"
    }
bodyType: graphql
description: Finalize and score a quiz submission (user)
