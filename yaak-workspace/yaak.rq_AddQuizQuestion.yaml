body:
  query: |
    mutation AddQuizQuestion($quizId: ID!, $input: CreateQuizQuestionInput!) {
      addQuizQuestion(quizId: $quizId, input: $input) {
        id
        questionText
        questionOrder
        timeoutSeconds
        ... on PredefinedQuestion {
          allowMultipleSelection
          predefinedAnswers {
            id
            answerText
            answerOrder
            isCorrect
          }
        }
        ... on NumberQuestion {
          minValue
          maxValue
          stepValue
        }
      }
    }
  variables: |
    {
      "quizId": "QZ01KCF91CSRSGJWA3JKYHR587GS",
