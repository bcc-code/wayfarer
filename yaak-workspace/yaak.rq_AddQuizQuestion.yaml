body:
  query: |
    mutation AddQuizQuestion($quizId: ID!, $input: CreateQuizQuestionInput!) {
      addQuizQuestion(quizId: $quizId, input: $input) {
        id
        questionText
        questionOrder
        timeoutSeconds
        ... on PredefinedQuestion {
          allowMultipleSelection
          predefinedAnswers {
            id
            answerText
            answerOrder
            isCorrect
          }
        }
        ... on NumberQuestion {
          minValue
          maxValue
          stepValue
        }
      }
    }
  variables: |
    {
      "quizId": "QZ01KBZWN4PRARY23WRKV63CTYRG",
      "input": {
        "questionType": "PREDEFINED",
        "questionText": "What is the capital of Norway?",
        "questionOrder": 1,
        "timeoutSeconds": 30,
        "allowMultipleSelection": false,
        "predefinedAnswers": [
          {
            "answerText": "Oslo",
            "isCorrect": true,
            "answerOrder": 1
          },
          {
            "answerText": "Bergen",
            "isCorrect": false,
            "answerOrder": 2
          },
          {
            "answerText": "Trondheim",
            "isCorrect": false,
            "answerOrder": 3
          },
          {
            "answerText": "Stavanger",
            "isCorrect": false,
            "answerOrder": 4
          }
        ]
      }
    }
