body:
  query: |
    mutation BulkAwardAchievementsByUserIds($userIds: [ID!]!, $achievementId: ID!) {
      bulkAwardAchievements(userIds: $userIds, achievementId: $achievementId) {
        id
        name
        points
        achievedAt
        ... on SimpleAchievement {
          project {
            id
            name
          }
        }
        ... on ContentAchievement {
          totalItems
          completedItemCount
          project {
            id
            name
          }
        }
        ... on StreakAchievement {
          neededStreak
          project {
            id
            name
          }
        }
      }
    }
