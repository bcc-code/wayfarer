body:
  query: |
    mutation BulkAwardAchievementsCombined($teamId: ID!, $userIds: [ID!]!, $achievementId: ID!) {
      bulkAwardAchievements(teamId: $teamId, userIds: $userIds, achievementId: $achievementId) {
        id
        name
        points
        achievedAt
        ... on SimpleAchievement {
          project {
            id
            name
          }
        }
        ... on ContentAchievement {
          totalItems
          completedItemCount
          project {
            id
            name
          }
        }
        ... on StreakAchievement {
          neededStreak
          project {
            id
            name
          }
        }
      }
    }
  variables: |
    {
      "teamId": "TM01EXAMPLE00000000000000000",
      "userIds": ["US01EXAMPLE00000000000000000", "US01EXAMPLE00000000000000001"],
      "achievementId": "AC01EXAMPLE00000000000000000"
    }
bodyType: graphql
description: Award an achievement to all team members plus additional specific users (M2M/admin only)
