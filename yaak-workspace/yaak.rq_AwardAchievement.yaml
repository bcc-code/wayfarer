body:
  query: |
    mutation AwardAchievement($userId: ID!, $achievementId: ID!) {
      awardAchievement(userId: $userId, achievementId: $achievementId) {
        id
        name
        description
        points
        achievedAt
        ... on SimpleAchievement {
          project {
            id
            name
          }
        }
        ... on ContentAchievement {
          totalItems
          completedItemCount
          project {
            id
            name
          }
        }
        ... on StreakAchievement {
          neededStreak
          project {
            id
            name
          }
        }
      }
    }
  variables: |
    {
      "userId": "US01ARZ3NDEKTSV4RRFFQ69G5FAV",
      "achievementId": "AC01ARZ3NDEKTSV4RRFFQ69G5FAV"
    }
bodyType: graphql
description: Award an achievement to a user (M2M/admin only)
