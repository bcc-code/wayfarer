body:
  query: |
    query ListTeams($filter: TeamFilter, $first: Int, $after: String) {
      teams(filter: $filter, first: $first, after: $after) {
        edges {
          cursor
          node {
            id
            name
            description
            joinCode
            leaderboardExcluded
            averageAge
            members {
              id
              name
              isTeamLead
              joinedAt
              church {
                name
                id
              }
            }
            parentProject {
              id
              name
            }
            superTeam {
              id
              name
            }
          }
        }
        pageInfo {
          hasNextPage
          hasPreviousPage
          startCursor
          endCursor
        }
        totalCount
      }
    }
  variables: |
    {
      "filter": {
        "projectId": "PR01K9VZ8684DP9R4W3ZEV526E5X"
      },
      "first": 10
    }
bodyType: graphql
