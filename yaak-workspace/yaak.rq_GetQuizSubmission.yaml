authentication: {}
authenticationType: null
body:
  query: |
    query GetQuizSubmission($id: ID!) {
      quizSubmission(id: $id) {
        id
        startedAt
        completedAt
        expiresAt
        isExpired
        score
        maxScore
        scorePercentage
        pointsAwarded
        questionOrder
        quiz {
          id
          name
        }
        user {
          id
          name
        }
        responses {
          id
          answeredAt
          timeSpentSeconds
          question {
            id
            questionText
          }
          ... on PredefinedResponse {
            selectedAnswerIds
            selectedAnswers {
              id
              answerText
              isCorrect
            }
            isCorrect
            pointsEarned
          }
          ... on FreeTextResponse {
            textResponse
            pointsEarned
          }
          ... on NumberResponse {
            numberResponse
            pointsEarned
          }
          ... on JsonResponse {
            jsonResponse
            pointsEarned
          }
          ... on OrderingResponse {
            submittedOrder
            isCorrect
            pointsEarned
          }
        }
      }
    }
  variables: |
    {
      "id": "QS01KBZXB9XAGZZ38CRCXHDQE192"
    }
bodyType: graphql
description: Get a quiz submission by ID
headers:
- enabled: true
  name: Content-Type
  value: application/json
  id: hdr_GetQuizSubmission
method: POST
name: Get Quiz Submission
sortPriority: 5000.0
url: ${[ HOST ]}/graphql
urlParameters: []
