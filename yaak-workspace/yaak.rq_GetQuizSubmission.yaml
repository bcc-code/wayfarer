body:
  query: |
    query GetQuizSubmission($id: ID!) {
      quizSubmission(id: $id) {
        id
        startedAt
        completedAt
        expiresAt
        isExpired
        score
        maxScore
        scorePercentage
        pointsAwarded
        questionOrder
        quiz {
          id
          name
        }
        user {
          id
          name
        }
        responses {
          id
          question {
            id
            questionText
            questionType
          }
          selectedAnswers {
            id
            answerText
            isCorrect
          }
          textResponse
          numberResponse
          jsonResponse
          isCorrect
          answeredAt
          timeSpentSeconds
        }
      }
    }
  variables: |
    {
      "id": "QS01ARZ3NDEKTSV4RRFFQ69G5FAV"
    }
