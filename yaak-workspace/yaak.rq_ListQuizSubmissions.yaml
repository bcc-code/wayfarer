body:
  query: |
    query ListQuizSubmissions($quizId: ID!, $userId: ID, $first: Int, $after: String) {
      quizSubmissions(quizId: $quizId, userId: $userId, first: $first, after: $after) {
        edges {
          cursor
          node {
            id
            startedAt
            completedAt
            score
            maxScore
            scorePercentage
            pointsAwarded
            user {
              id
              name
            }
          }
        }
        pageInfo {
          hasNextPage
          hasPreviousPage
          startCursor
          endCursor
        }
        totalCount
      }
    }
  variables: |
    {
      "quizId": "QZ01ARZ3NDEKTSV4RRFFQ69G5FAV",
      "first": 10
    }
