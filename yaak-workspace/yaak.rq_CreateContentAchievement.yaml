body:
  query: |
    mutation CreateContentAchievement {
      createContentAchievement(input: {
        name: "Leseplan uke 1"
        descriptionPending: "Fullfør uke 1 av leseplanen (5. januar-9. januar)."
        descriptionCompleted: "Gratulerer med å ha fullført den første uken i leseplanen! Fortsett slik."
        notificationText: "Ladder to Heaven:\nNy utmerkelse oppnådd🎖 Gratulerer med å ha fullført første uke av leseplanen!"
        imagePending: ""
        imageCompleted: ""
        projectId: "PR01K9VZ8684DP9R4W3ZEV526E5X"
        points: 10
        hidden: false
        items: []
      }) {
        id
        name
        points
        hidden
        totalItems
        items {
          id
          sortOrder
          externalContent {
            id
            planId
            taskId
            contentId
            contentType
            title
          }
        }
        project {
          id
          name
        }
        event {
          id
          name
        }
        challenge {
          id
          name
        }
      }
    }
