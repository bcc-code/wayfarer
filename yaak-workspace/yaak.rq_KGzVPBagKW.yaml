body:
  query: |
    query TestTeamLeaderboard {
      projects(first: 3) {
        edges {
          node {
            name
            leaderboard(entityType: TEAMS, first: 30) {
              me {
                score
                rank
                name
              }
              pageInfo{
                endCursor
              }
              edges {
                node {
                  id
                  rank
                  score
                  name
                  description
                  tags
                }
              }
            }
          }
        }
      }
      team(id: "TM01K9VZ86X3GX5N7W3MMC65GJMJ") {
        id
        name
        memberLeaderboard {
          id
          rank
          score
          name
          description
          tags
        }
      }
      me {
        name
        roles {
          role
          scope {
            team {
              id
            }
          }
        }
      }
    }
