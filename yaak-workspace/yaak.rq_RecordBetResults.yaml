body:
  query: |
    mutation RecordBetResults($inputs: [RecordBetResultInput!]!) {
      recordBetResults(inputs: $inputs) {
        id
        answeredAt
        timeSpentSeconds
        pointsEarned
        betAmount
        journalEntry {
          id
          sourceType
          points
          reason
          createdAt
        }
        question {
          id
          questionText
        }
      }
    }
  variables: |
    {
      "inputs": [
        {
          "responseId": "QR01ARZ3NDEKTSV4RRFFQ69G5FA1",
          "pointsEarned": 100,
          "sendNotification": true
        },
        {
          "responseId": "QR01ARZ3NDEKTSV4RRFFQ69G5FA2",
          "pointsEarned": -50,
          "sendNotification": true
        },
        {
          "responseId": "QR01ARZ3NDEKTSV4RRFFQ69G5FA3",
          "pointsEarned": 0,
          "sendNotification": false
        }
      ]
    }
bodyType: graphql
description: |
  Record multiple bet results in bulk (M2M/Admin only).

  Same as recordBetResult but processes multiple responses at once.
  Each input creates a separate score journal entry.

  Use this for batch processing bet results, e.g., after a quiz session ends.

  Note: Notifications are sent in parallel goroutines (fire-and-forget).
  No notification is sent for responses with pointsEarned=0.
