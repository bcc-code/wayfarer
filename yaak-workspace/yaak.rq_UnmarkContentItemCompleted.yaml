body:
  query: |
    mutation UnmarkContentItemCompleted($userId: ID!, $achievementId: ID!, $externalContentId: ID!) {
      unmarkContentItemCompleted(userId: $userId, achievementId: $achievementId, externalContentId: $externalContentId) {
        id
        name
        totalItems
        completedItemCount
        userCompletedItems {
          id
