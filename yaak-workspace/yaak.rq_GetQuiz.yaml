body:
  query: |
    query GetQuiz($id: ID!) {
      quiz(id: $id) {
        id
        name
        description
        timeoutSeconds
        randomizeQuestions
        revealCorrectAnswers
        allowRetakes
        completionPoints
        endTime
        userCanStart
        sessions {
          id
          name
          state
          finishAt
          openAt
          lockAt
        }
        userActiveSubmission {
          id
          startedAt
          expiresAt
          isExpired
        }
        questions {
          id
          questionText
          questionOrder
          timeoutSeconds
          bettingEnabled
          bettingMinPercentage
          bettingMaxPercentage
          bettingMinAbsolute
          bettingMaxAbsolute
          ... on OrderingQuestion {
            orderingItems {
              id
              itemText
            }
          }
          ... on PredefinedQuestion {
            allowMultipleSelection
            predefinedAnswers {
              id
              answerText
              answerOrder
              isCorrect
            }
          }
          ... on NumberQuestion {
            minValue
            maxValue
            stepValue
          }
        }
        project {
          id
          name
        }
        challenge {
          id
          name
        }
      }
    }
  variables: |
    {
      "id": "QZ01KCKBKDX498QPVFRCSAKNSDEN"
    }
bodyType: graphql
description: Get a quiz by ID with all questions
headers:
- enabled: true
  name: Content-Type
  value: application/json
  id: hdr_GetQuiz
method: POST
name: Get Quiz
sortPriority: 1000.0
url: ${[ HOST ]}/graphql
urlParameters: []
