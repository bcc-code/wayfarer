body:
  query: |
    query GetQuiz($id: ID!) {
      quiz(id: $id) {
        id
        name
        description
        image
        timeoutSeconds
        randomizeQuestions
        revealCorrectAnswers
        allowRetakes
        completionPoints
        publishedAt
        endTime
        userCanStart
        userActiveSubmission {
          id
          startedAt
          expiresAt
          isExpired
        }
        questions {
          id
          questionText
          questionOrder
          timeoutSeconds
          ... on PredefinedQuestion {
            allowMultipleSelection
            predefinedAnswers {
              id
              answerText
              answerOrder
              isCorrect
            }
          }
          ... on NumberQuestion {
            minValue
            maxValue
            stepValue
          }
        }
        project {
          id
          name
        }
        challenge {
          id
          name
        }
      }
    }
  variables: |
    {
      "id": "QZ01KC1SR8V7JC7F1Q7RCYD946HD"
    }
bodyType: graphql
description: Get a quiz by ID with all questions
headers:
- enabled: true
  name: Content-Type
  value: application/json
  id: hdr_GetQuiz
method: POST
name: Get Quiz
