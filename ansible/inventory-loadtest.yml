# Load-test pair (Hetzner CCX33, Helsinki), provisioned with loadtest.yml:
#   interact-lt-server  prod copy (wayfarer + Postgres), TLS on 2-29-101-91.sslip.io
#   interact-lt-client  k6 load generator (tuning role only)
#   interact-lt-client2 second k6 generator: one CCX33 saturates (k6 ~800%
#                       CPU) before delivering the full 10k stampede
# Throwaway boxes; never add prod here. See notes/loadtest-offbox.md.
all:
  children:
    interact_lt:
      hosts:
        interact-lt-server:
          ansible_host: 2.29.101.91
          ansible_user: root
    interact_lt_client:
      hosts:
        interact-lt-client:
          ansible_host: 2.29.97.60
          ansible_user: root
          machine_hostname: interact-lt-client
        interact-lt-client2:
          ansible_host: 2.29.107.165
          ansible_user: root
          machine_hostname: interact-lt-client2
