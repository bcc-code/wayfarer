# --- Host identity -------------------------------------------------------------
machine_hostname: interact-prod

# --- SSH / hardening ---------------------------------------------------------
# Root login stays enabled (key-only) because existing tooling
# (make loadtest-remote-*) connects as root@.
ssh_permit_root_login: prohibit-password
ssh_port: 22

# --- Firewall ----------------------------------------------------------------
firewall_allowed_tcp_ports:
  - "{{ ssh_port }}"
  - 80    # wayfarer server (ACME http-01 challenges + redirect to HTTPS)
  - 443   # wayfarer server (native Go TLS termination)

# --- Tailscale -----------------------------------------------------------------
# Only needed for the first join (node not yet on the tailnet). Generate a
# (preferably pre-authorized, single-use) key in the Tailscale admin console
# and pass it via vault or -e; never commit a real value.
tailscale_authkey: "{{ vault_tailscale_authkey | default('') }}"

# --- PostgreSQL ---------------------------------------------------------------
postgres_version: 17
# Loopback plus the node's Tailscale addresses (looked up with `tailscale ip`
# in roles/postgres). ip_nonlocal_bind (also set there) lets Postgres bind
# them even when it starts before tailscaled has brought the interface up.
# pg_hba.conf additionally admits only the read-only roles from the tailnet.
# When postgres_external_clients is set, the public IPv4 is bound too (ufw
# opens 5432 to those clients only; pg_hba requires TLS for them).
postgres_listen_addresses: >-
  127.0.0.1,::1,{{ postgres_tailscale_ips | join(',') }}{{
  (',' ~ ansible_facts['default_ipv4']['address'])
  if postgres_external_clients | length > 0 else '' }}
# TLS reuses the wayfarer server's Let's Encrypt cert (autocert cache, one
# combined key+chain PEM per domain), synced into postgres_tls_dir.
postgres_tls_domain: interact.bcc.media
postgres_tls_autocert_dir: /opt/wayfarer/autocert
postgres_tls_dir: "/etc/postgresql/{{ postgres_version }}/main/tls"
# Public IPv4 addresses allowed to reach 5432 over the internet. Admitted by
# pg_hba over TLS only (hostssl), as the read-only backup/metabase roles.
postgres_external_clients:
  - 85.112.141.130
# 500: each blue/green color runs DB_MAX_OPEN_CONNS=230 (roles/wayfarer), and
# both colors are up concurrently during a deploy — 460 peak, leaving 40 for
# psql/monitoring/bench headroom. (100 total starved the pool at spike
# peak, SQLSTATE 53300.) work_mem in the template scales with this — at
# 500 conns / 62GB it lands around 32MB per sort node, still comfortable.
postgres_max_connections: 500

# --- Interact (Wayfarer) -------------------------------------------------------
interact_db_name: interact
interact_db_user: interact
# Set via `ansible-vault` or -e on the command line; never commit a real value.
interact_db_password: "{{ vault_interact_db_password | default('CHANGE_ME') }}"

# --- Backup (read-only, tailnet only) ------------------------------------------
# Tailscale address ranges (IPv4 CGNAT + IPv6 ULA) admitted in pg_hba.conf
# for the read-only backup role only.
tailnet_cidrs:
  - 100.64.0.0/10
  - fd7a:115c:a1e0::/48
backup_db_user: backup
# Set via `ansible-vault` or -e on the command line; never commit a real value.
backup_db_password: "{{ vault_backup_db_password | default('CHANGE_ME') }}"

# --- Metabase (read-only, external clients over TLS) --------------------------
# Same read-only grants as backup; admitted only from postgres_external_clients.
metabase_db_user: metabase
# Set via `ansible-vault` or -e on the command line; never commit a real value.
metabase_db_password: "{{ vault_metabase_db_password | default('CHANGE_ME') }}"

# --- Scheduled jobs (roles/jobs) -----------------------------------------------
# systemd timers that POST to the app's trigger endpoints. Keys are read at
# run time from /opt/wayfarer/wayfarer.env (TRANSLATIONS_EXPORT_KEY,
# SSF_SYNC_KEY, EXTERNAL_API_KEYS), not stored here.
wayfarer_jobs_base_url: https://interact.bcc.no
# Which EXTERNAL_API_KEYS entry ("<source>:<key>") the maintenance calls use.
wayfarer_jobs_api_key_source: cron
wayfarer_jobs_ssf_plan_slug: hidden-treasures-podcast
# The full-table member sync is one long synchronous request.
wayfarer_jobs_curl_max_time: 3600
# OnCalendar syntax (`systemd-analyze calendar '<spec>'` to check).
wayfarer_jobs:
  - name: export-translations
    on_calendar: "*-*-* *:00:00 Europe/Oslo"
  - name: sync-ssf
    on_calendar: "*-*-* 05:00:00 Europe/Oslo"
  # Monday night: refresh existing users, then import newly eligible members.
  - name: sync-members
    on_calendar: "Tue *-*-* 02:00:00 Europe/Oslo"
