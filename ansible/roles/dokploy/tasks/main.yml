---
# Installs Dokploy via the official installer (idempotent: skipped when the
# dokploy swarm service already exists). Dokploy brings its own Docker +
# swarm setup and a bundled Traefik that owns ports 80/443 — domains and
# TLS (interact-test.bcc.media) are configured per-app in the Dokploy UI.

- name: Install prerequisites
  ansible.builtin.apt:
    name:
      - curl
      - ca-certificates
    state: present

# check_mode: false on the read-only probes so their results exist in --check
- name: Check whether Dokploy is already installed
  ansible.builtin.command: docker service inspect dokploy
  register: dokploy_service
  changed_when: false
  failed_when: false
  check_mode: false

- name: Download Dokploy installer
  ansible.builtin.get_url:
    url: https://dokploy.com/install.sh
    dest: /root/dokploy-install.sh
    mode: "0700"
  when: dokploy_service.rc != 0

- name: Run Dokploy installer
  ansible.builtin.command: /root/dokploy-install.sh
  when: dokploy_service.rc != 0
  register: dokploy_install
  changed_when: dokploy_install.rc == 0
