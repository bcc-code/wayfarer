---
# Listed first: handlers run in file order, so the sysctl is live before a
# restart tries to bind the tailscale addresses.
- name: Reload sysctl (postgres)
  ansible.builtin.command: sysctl --system
  changed_when: true

- name: Restart postgresql
  ansible.builtin.systemd:
    name: postgresql
    state: restarted

- name: Reload postgresql
  ansible.builtin.systemd:
    name: postgresql
    state: reloaded
