---
- name: Install PostgreSQL and helpers
  ansible.builtin.apt:
    name:
      - "postgresql-{{ postgres_version }}"
      - postgresql-client
      - postgresql-contrib   # pg_stat_statements
      - python3-psycopg2   # for community.postgresql modules
      - ssl-cert           # snakeoil fallback cert until LE is synced
    state: present

# ignore_errors in --check: unit/config dirs don't exist until the
# package install above has really run.
- name: Ensure PostgreSQL is enabled and running
  ansible.builtin.systemd:
    name: postgresql
    enabled: true
    state: started
  ignore_errors: "{{ ansible_check_mode }}"

# Postgres binds the node's Tailscale addresses (see postgres_listen_addresses)
# but may start before tailscaled has brought them up on boot. Non-local
# bind lets the socket be created anyway; traffic flows once the address
# appears.
- name: Allow binding addresses that are not up yet (tailscale IPs)
  ansible.builtin.copy:
    dest: /etc/sysctl.d/92-postgres-nonlocal-bind.conf
    content: |
      # Postgres listens on the tailscale IPs, which tailscaled assigns after
      # boot; let it bind them before they exist.
      net.ipv4.ip_nonlocal_bind = 1
      net.ipv6.ip_nonlocal_bind = 1
    owner: root
    group: root
    mode: "0644"
  notify: Reload sysctl (postgres)

# `tailscale ip` prints the node's IPv4 and IPv6 tailnet addresses, one per
# line. They are stable for the lifetime of the node.
- name: Query tailscale addresses
  ansible.builtin.command: tailscale ip
  register: tailscale_ip_result
  check_mode: false
  changed_when: false
  failed_when: false

- name: Collect tailscale addresses for listen_addresses
  ansible.builtin.set_fact:
    postgres_tailscale_ips: >-
      {{ (tailscale_ip_result.stdout | default('')).splitlines()
         | map('trim') | select('ne', '') | list
         if tailscale_ip_result.rc | default(1) == 0 else [] }}

- name: Fail if the node has no tailscale address
  ansible.builtin.assert:
    that: postgres_tailscale_ips | length > 0
    fail_msg: >-
      `tailscale ip` returned nothing. Postgres binds the tailnet addresses,
      so join the node first (`make tailscale`) and rerun.
  # In --check on a fresh box tailscale is not installed/joined yet.
  ignore_errors: "{{ ansible_check_mode }}"

- name: Deploy tuning configuration
  ansible.builtin.template:
    src: 90-tuning.conf.j2
    dest: "/etc/postgresql/{{ postgres_version }}/main/conf.d/90-tuning.conf"
    owner: postgres
    group: postgres
    mode: "0644"
  notify: Restart postgresql
  ignore_errors: "{{ ansible_check_mode }}"

- name: Deploy pg_hba.conf
  ansible.builtin.template:
    src: pg_hba.conf.j2
    dest: "/etc/postgresql/{{ postgres_version }}/main/pg_hba.conf"
    owner: postgres
    group: postgres
    mode: "0640"
  notify: Reload postgresql
  ignore_errors: "{{ ansible_check_mode }}"

# --- TLS: reuse the wayfarer server's Let's Encrypt cert --------------------
# The app obtains/renews the cert in-process (autocert). pg-sync-le-cert
# splits autocert's combined PEM into Postgres-owned key/cert files and
# reloads Postgres; a path unit fires it on renewal, a daily timer backs it
# up. Until a LE cert exists the snakeoil pair is used.
- name: Configure Postgres TLS from the Let's Encrypt cert
  ignore_errors: "{{ ansible_check_mode }}"
  block:
    - name: Create Postgres TLS directory
      ansible.builtin.file:
        path: "{{ postgres_tls_dir }}"
        state: directory
        owner: postgres
        group: postgres
        mode: "0750"

    - name: Seed snakeoil fallback certificate (only if none present)
      ansible.builtin.copy:
        src: "{{ item.src }}"
        dest: "{{ postgres_tls_dir }}/{{ item.dest }}"
        remote_src: true
        force: false
        owner: postgres
        group: postgres
        mode: "{{ item.mode }}"
      loop:
        - { src: /etc/ssl/certs/ssl-cert-snakeoil.pem, dest: server.crt, mode: "0644" }
        - { src: /etc/ssl/private/ssl-cert-snakeoil.key, dest: server.key, mode: "0600" }
      notify: Reload postgresql

    - name: Install cert sync script
      ansible.builtin.template:
        src: pg-sync-le-cert.sh.j2
        dest: /usr/local/sbin/pg-sync-le-cert
        owner: root
        group: root
        mode: "0755"

    - name: Install cert sync systemd units
      ansible.builtin.copy:
        src: "{{ item }}"
        dest: "/etc/systemd/system/{{ item }}"
        owner: root
        group: root
        mode: "0644"
      loop:
        - pg-sync-le-cert.service
        - pg-sync-le-cert.timer

    - name: Install cert sync path unit
      ansible.builtin.template:
        src: pg-sync-le-cert.path.j2
        dest: /etc/systemd/system/pg-sync-le-cert.path
        owner: root
        group: root
        mode: "0644"

    - name: Enable cert sync path and timer
      ansible.builtin.systemd:
        name: "{{ item }}"
        enabled: true
        state: started
        daemon_reload: true
      loop:
        - pg-sync-le-cert.path
        - pg-sync-le-cert.timer

    # Pick up an existing LE cert right away. Runs after the conf.d/pg_hba
    # templates above; if Postgres is restarted later by a handler it
    # simply loads the synced files.
    - name: Sync Let's Encrypt certificate now
      ansible.builtin.command: /usr/local/sbin/pg-sync-le-cert
      register: pg_cert_sync
      changed_when: "'installed new certificate' in pg_cert_sync.stdout"
