---
- name: Install ufw
  ansible.builtin.apt:
    name: ufw
    state: present

# ignore_errors in --check: the ufw binary doesn't exist until the
# package install above has really run.
- name: Configure ufw rules
  ignore_errors: "{{ ansible_check_mode }}"
  block:
    - name: Set default policies (deny incoming, allow outgoing)
      community.general.ufw:
        direction: "{{ item.direction }}"
        policy: "{{ item.policy }}"
      loop:
        - { direction: incoming, policy: deny }
        - { direction: outgoing, policy: allow }

    - name: Allow public TCP ports
      community.general.ufw:
        rule: allow
        port: "{{ item }}"
        proto: tcp
      loop: "{{ firewall_allowed_tcp_ports }}"

    - name: Allow Dokploy UI from trusted sources only
      community.general.ufw:
        rule: allow
        port: "{{ dokploy_ui_port }}"
        proto: tcp
        from_ip: "{{ item }}"
      loop: "{{ dokploy_ui_allowed_sources }}"
      when: dokploy_ui_allowed_sources | length > 0

    - name: Allow Dokploy UI from anywhere (no source restriction configured)
      community.general.ufw:
        rule: allow
        port: "{{ dokploy_ui_port }}"
        proto: tcp
      when: dokploy_ui_allowed_sources | length == 0

    - name: Allow Docker containers to reach host Postgres
      community.general.ufw:
        rule: allow
        port: "5432"
        proto: tcp
        from_ip: "{{ postgres_docker_cidr }}"

    - name: Rate-limit SSH
      community.general.ufw:
        rule: limit
        port: "{{ ssh_port }}"
        proto: tcp

    - name: Enable ufw
      community.general.ufw:
        state: enabled
