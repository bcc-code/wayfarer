---
- name: Install ufw
  ansible.builtin.apt:
    name: ufw
    state: present

# ignore_errors in --check: the ufw binary doesn't exist until the
# package install above has really run.
- name: Configure ufw rules
  ignore_errors: "{{ ansible_check_mode }}"
  block:
    - name: Set default policies (deny incoming, allow outgoing)
      community.general.ufw:
        direction: "{{ item.direction }}"
        policy: "{{ item.policy }}"
      loop:
        - { direction: incoming, policy: deny }
        - { direction: outgoing, policy: allow }

    - name: Allow public TCP ports
      community.general.ufw:
        rule: allow
        port: "{{ item }}"
        proto: tcp
      loop: "{{ firewall_allowed_tcp_ports }}"

    - name: Allow all traffic on the tailnet interface
      community.general.ufw:
        rule: allow
        interface: tailscale0
        direction: in

    - name: Allow Tailscale WireGuard port (direct connections instead of DERP relays)
      community.general.ufw:
        rule: allow
        port: "41641"
        proto: udp

    - name: Rate-limit SSH
      community.general.ufw:
        rule: limit
        port: "{{ ssh_port }}"
        proto: tcp

    - name: Enable ufw
      community.general.ufw:
        state: enabled
