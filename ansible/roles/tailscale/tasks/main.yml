---
# Joins the box to the tailnet. The auth key is only needed for the first
# join (or after `tailscale logout`); once the node is Running the role is
# a no-op and reruns don't need the key.

# deb822_repository (below) needs the python3-debian bindings on the host
- name: Install python3-debian
  ansible.builtin.apt:
    name: python3-debian
    state: present

- name: Add Tailscale apt repository
  ansible.builtin.deb822_repository:
    name: tailscale
    types: deb
    uris: https://pkgs.tailscale.com/stable/debian
    suites: "{{ ansible_facts['distribution_release'] }}"
    components: main
    signed_by: "https://pkgs.tailscale.com/stable/debian/{{ ansible_facts['distribution_release'] }}.noarmor.gpg"

- name: Install tailscale
  ansible.builtin.apt:
    name: tailscale
    state: present
    update_cache: true

- name: Ensure tailscaled is enabled and running
  ansible.builtin.systemd:
    name: tailscaled
    enabled: true
    state: started
  # Unit doesn't exist in --check until the package is really installed.
  ignore_errors: "{{ ansible_check_mode }}"

# `tailscale status --json` reports BackendState (NeedsLogin/Running/...)
# and exits 0 even when logged out, unlike the plain status command.
- name: Query tailscale backend state
  ansible.builtin.command: tailscale status --json
  register: tailscale_status
  check_mode: false
  changed_when: false
  failed_when: false

- name: Determine whether the node is already joined
  ansible.builtin.set_fact:
    tailscale_joined: >-
      {{ tailscale_status.rc | default(1) == 0 and
         (tailscale_status.stdout | default('{}') | from_json).BackendState | default('') == 'Running' }}

- name: Fail if joining requires an auth key that was not provided
  ansible.builtin.assert:
    that: tailscale_joined or (tailscale_authkey | length > 0)
    fail_msg: >-
      Node is not on the tailnet and no auth key was given. Generate one at
      https://login.tailscale.com/admin/settings/keys and pass it with
      -e tailscale_authkey=tskey-auth-... (or vault_tailscale_authkey).
  # In --check on a fresh box the status probe can't run yet.
  ignore_errors: "{{ ansible_check_mode }}"

- name: Join the tailnet
  ansible.builtin.command: tailscale up --authkey={{ tailscale_authkey }}
  when: not (tailscale_joined | default(true) | bool)
  no_log: true
  ignore_errors: "{{ ansible_check_mode }}"
