---
# Load-test / high-connection-count tuning. Codifies the base linux
# optimizations applied by hand during the first load-testing rounds
# (the load-test tooling assumes `ulimit -n 65535`; the sysctl set covers
# 10k+ concurrent connections through traefik/docker NAT).

- name: Ensure nf_conntrack module loads at boot (sysctl key must exist)
  ansible.builtin.copy:
    dest: /etc/modules-load.d/91-loadtest-tuning.conf
    content: |
      nf_conntrack
    owner: root
    group: root
    mode: "0644"

- name: Load nf_conntrack module now
  community.general.modprobe:
    name: nf_conntrack
    state: present

- name: Apply load-test sysctl tuning
  ansible.builtin.copy:
    dest: /etc/sysctl.d/91-loadtest-tuning.conf
    content: |
      # Accept-queue depth for listening sockets (traefik, the app, postgres)
      net.core.somaxconn = 8192
      net.ipv4.tcp_max_syn_backlog = 8192
      # NIC ingress queue under bursty arrival (10k users in 10s)
      net.core.netdev_max_backlog = 8192
      # More ephemeral ports for proxy hops (traefik -> container, app -> db)
      net.ipv4.ip_local_port_range = 10240 65535
      # Reuse TIME_WAIT sockets for outgoing connections
      net.ipv4.tcp_tw_reuse = 1
      # Docker NATs every connection through conntrack; default table is too
      # small for spike tests and drops packets silently when full
      net.netfilter.nf_conntrack_max = 262144
    owner: root
    group: root
    mode: "0644"
  notify: Reload sysctl (tuning)

- name: Raise open-file limits for login sessions
  ansible.builtin.copy:
    dest: /etc/security/limits.d/91-loadtest-tuning.conf
    content: |
      * soft nofile 65535
      * hard nofile 65535
      root soft nofile 65535
      root hard nofile 65535
    owner: root
    group: root
    mode: "0644"

- name: Ensure /etc/systemd/system.conf.d exists
  ansible.builtin.file:
    path: /etc/systemd/system.conf.d
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Raise default open-file limit for systemd services
  ansible.builtin.copy:
    dest: /etc/systemd/system.conf.d/91-loadtest-tuning.conf
    content: |
      [Manager]
      DefaultLimitNOFILE=65535
    owner: root
    group: root
    mode: "0644"
  notify: Reexec systemd
