---
# Load-test / high-connection-count tuning. Codifies the base linux
# optimizations applied by hand during the first load-testing rounds
# (the load-test tooling assumes `ulimit -n 65535`; the sysctl set covers
# 10k+ concurrent connections hitting the native listener directly).

- name: Ensure nf_conntrack module loads at boot (sysctl key must exist)
  ansible.builtin.copy:
    dest: /etc/modules-load.d/91-loadtest-tuning.conf
    content: |
      nf_conntrack
    owner: root
    group: root
    mode: "0644"

- name: Load nf_conntrack module now
  community.general.modprobe:
    name: nf_conntrack
    state: present

- name: Apply load-test sysctl tuning
  ansible.builtin.copy:
    dest: /etc/sysctl.d/91-loadtest-tuning.conf
    content: |
      # Accept-queue depth for listening sockets (the app, postgres)
      net.core.somaxconn = 8192
      net.ipv4.tcp_max_syn_backlog = 8192
      # NIC ingress queue under bursty arrival (10k users in 10s)
      net.core.netdev_max_backlog = 8192
      # More ephemeral ports for outgoing connections (app -> db, ACME dials)
      net.ipv4.ip_local_port_range = 10240 65535
      # Reuse TIME_WAIT sockets for outgoing connections
      net.ipv4.tcp_tw_reuse = 1
      # ufw's stateful rules track every client flow through conntrack; the
      # default table is too small for spike tests and drops packets silently
      # when full. (Docker NAT is gone, so half the old 262144 suffices.)
      net.netfilter.nf_conntrack_max = 131072
    owner: root
    group: root
    mode: "0644"
  notify: Reload sysctl (tuning)

- name: Raise open-file limits for login sessions
  ansible.builtin.copy:
    dest: /etc/security/limits.d/91-loadtest-tuning.conf
    content: |
      * soft nofile 65535
      * hard nofile 65535
      root soft nofile 65535
      root hard nofile 65535
    owner: root
    group: root
    mode: "0644"

- name: Ensure /etc/systemd/system.conf.d exists
  ansible.builtin.file:
    path: /etc/systemd/system.conf.d
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Raise default open-file limit for systemd services
  ansible.builtin.copy:
    dest: /etc/systemd/system.conf.d/91-loadtest-tuning.conf
    content: |
      [Manager]
      DefaultLimitNOFILE=65535
    owner: root
    group: root
    mode: "0644"
  notify: Reexec systemd

# The box shipped with the `powersave` governor, capping clocks at ~71% and
# poisoning the first load-test rounds. Pin `performance` persistently.
- name: Install CPU governor systemd unit
  ansible.builtin.copy:
    dest: /etc/systemd/system/cpu-governor-performance.service
    content: |
      [Unit]
      Description=Set CPU frequency governor to performance

      [Service]
      Type=oneshot
      ExecStart=/bin/sh -c 'for g in /sys/devices/system/cpu/cpu*/cpufreq/scaling_governor; do [ -e "$g" ] && echo performance > "$g"; done'
      RemainAfterExit=yes

      [Install]
      WantedBy=multi-user.target
    owner: root
    group: root
    mode: "0644"

# ignore_errors in --check: the unit file above doesn't really exist yet
# during a dry run.
- name: Enable and apply the CPU governor unit
  ignore_errors: "{{ ansible_check_mode }}"
  ansible.builtin.systemd_service:
    name: cpu-governor-performance.service
    enabled: true
    state: started
    daemon_reload: true
