query ProfilePage($ageFilter: LeaderboardFilter) {
  me {
    id
    name
    consentStatus {
      pendingConsents {
        __typename
        id
        key
        version
        title
        body {
          html
        }
        shortText
        url
        managementType
        managedBy
      }
    }
  }
  myCurrentProject {
    id
    name
    infoMessage {
      markdown
      html
    }
    infoMessageStart
    infoMessageEnd
    branding {
      ...BrandingFields
    }
    achievements {
      __typename
      id
      name
      descriptionPending
      descriptionCompleted
      imagePendingObject {
        ...ImageFields
      }
      imageCompletedObject {
        ...ImageFields
      }
      hidden
      achievedAt
      celebratedAt
      points
    }
    myPoints
    leaderboard(entityType: PERSONS, filter: $ageFilter) {
      me {
        rank
      }
    }
    myTeam {
      superTeam {
        id
        name
        color
        imageObject {
          url
          blurhash
        }
      }
    }
  }
}
