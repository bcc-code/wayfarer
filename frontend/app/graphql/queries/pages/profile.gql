query ProfilePage {
  me {
    id
    name
    consentStatus {
      pendingConsents {
        __typename
        id
        key
        version
        title
        body {
          html
        }
        shortText
        url
        managementType
        managedBy
      }
    }
  }
  myCurrentProject {
    id
    name
    achievements {
      id
      name
      descriptionPending
      descriptionCompleted
      imagePending
      imageCompleted
      hidden
      achievedAt
      points
      ... on QuizAchievement {
        minScorePercentage
        requireCompletion
      }
      ... on StreakAchievement {
        neededStreak
        streak {
          name
          description
          status
          relevantDays {
            start
            end
          }
          listenedDays(last: 5) {
            date
            active
          }
        }
      }
      ... on ContentAchievement {
        totalItems
        completedItemCount
        nextItem {
          id
          sortOrder
          externalContent {
            id
            contentType
            planId
            taskId
            contentId
            source
          }
        }
      }
    }
    leaderboard(entityType: PERSONS) {
      me {
        score
        rank
      }
    }
  }
}
