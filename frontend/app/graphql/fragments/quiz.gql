fragment PredefinedAnswerFields on QuizPredefinedAnswer {
  id
  answerText
  answerOrder
  isCorrect
  translationStatus {
    ...TranslationStatus
  }
}

fragment QuizQuestionFields on QuizQuestion {
  __typename
  id
  questionText
  questionOrder
  timeoutSeconds
  points
  bettingEnabled
  bettingMinPercentage
  bettingMaxPercentage
  bettingMinAbsolute
  bettingMaxAbsolute
  translationStatus {
    ...TranslationStatus
  }
  ... on PredefinedQuestion {
    allowMultipleSelection
    predefinedAnswers {
      ...PredefinedAnswerFields
    }
  }
  ... on NumberQuestion {
    minValue
    maxValue
    stepValue
  }
  ... on OrderingQuestion {
    orderingItems {
      id
      itemText
      correctOrder
    }
  }
}

# Variant without points (used in user-facing quiz)
fragment QuizQuestionUserFields on QuizQuestion {
  __typename
  id
  questionText
  questionOrder
  timeoutSeconds
  bettingEnabled
  bettingMinAbsolute
  bettingMaxAbsolute
  bettingMinPercentage
  bettingMaxPercentage
  ... on PredefinedQuestion {
    allowMultipleSelection
    predefinedAnswers {
      ...PredefinedAnswerFields
    }
  }
  ... on NumberQuestion {
    minValue
    maxValue
    stepValue
  }
  ... on OrderingQuestion {
    orderingItems {
      id
      itemText
      correctOrder
    }
  }
}

fragment QuizSubmissionResultFields on QuizSubmission {
  id
  completedAt
  score
  maxScore
  scorePercentage
  pointsAwarded
}
