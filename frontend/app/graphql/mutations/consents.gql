mutation AcceptConsent($consentId: ID!) {
  acceptConsent(consentId: $consentId) {
    id
    action
    actionDate
  }
}

mutation RejectConsent($consentId: ID!) {
  rejectConsent(consentId: $consentId) {
    id
    action
    actionDate
  }
}

mutation CreateConsent(
  $key: String!
  $title: String!
  $shortText: String
  $body: String!
  $url: String
  $buttonText: String
  $publishedAt: DateTime
  $isRemote: Boolean
  $managedBy: String
) {
  createConsent(
    key: $key
    title: $title
    shortText: $shortText
    body: $body
    url: $url
    buttonText: $buttonText
    publishedAt: $publishedAt
    isRemote: $isRemote
    managedBy: $managedBy
  ) {
    id
    key
    version
    title
  }
}

mutation UpdateConsent(
  $id: ID!
  $title: String
  $shortText: String
  $body: String
  $url: String
  $buttonText: String
  $publishedAt: DateTime
  $managedBy: String
) {
  updateConsent(
    id: $id
    title: $title
    shortText: $shortText
    body: $body
    url: $url
    buttonText: $buttonText
    publishedAt: $publishedAt
    managedBy: $managedBy
  ) {
    id
    key
    version
    title
  }
}
