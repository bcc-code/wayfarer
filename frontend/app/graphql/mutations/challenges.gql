mutation DeleteChallenge($id: ID!) {
  deleteChallenge(id: $id)
}

mutation UpdateChallenge($id: ID!, $input: UpdateChallengeInput!) {
  updateChallenge(id: $id, input: $input) {
    id
  }
}

mutation CreateChallenge(
  $projectId: ID!
  $eventId: ID
  $input: CreateChallengeInput!
) {
  createChallenge(projectId: $projectId, eventId: $eventId, input: $input) {
    id
  }
}

mutation BulkEnrollUsersInChallenge(
  $challengeId: ID!
  $target: EnrollmentTargetInput!
) {
  bulkEnrollUsersInChallenge(challengeId: $challengeId, target: $target) {
    id
  }
}

mutation EnrollInChallenge($challengeId: ID!) {
  enrollInChallenge(challengeId: $challengeId) {
    id
    userEnrolledAt
  }
}
