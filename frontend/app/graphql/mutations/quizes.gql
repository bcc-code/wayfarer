# Admin mutations
mutation CreateQuiz($input: CreateQuizInput!) {
  createQuiz(input: $input) {
    id
    name
  }
}

mutation UpdateQuiz($id: ID!, $input: UpdateQuizInput!) {
  updateQuiz(id: $id, input: $input) {
    id
    name
  }
}

mutation AddQuizQuestion($quizId: ID!, $input: CreateQuizQuestionInput!) {
  addQuizQuestion(quizId: $quizId, input: $input) {
    __typename
    id
    questionText
    questionOrder
    timeoutSeconds
    points
    ... on PredefinedQuestion {
      allowMultipleSelection
      predefinedAnswers {
        id
        answerText
        answerOrder
        isCorrect
      }
    }
    ... on NumberQuestion {
      minValue
      maxValue
      stepValue
    }
  }
}

mutation UpdateQuizQuestion($id: ID!, $input: UpdateQuizQuestionInput!) {
  updateQuizQuestion(id: $id, input: $input) {
    __typename
    id
    questionText
    questionOrder
    timeoutSeconds
    points
    ... on PredefinedQuestion {
      allowMultipleSelection
      predefinedAnswers {
        id
        answerText
        answerOrder
        isCorrect
      }
    }
    ... on NumberQuestion {
      minValue
      maxValue
      stepValue
    }
  }
}

mutation DeleteQuizQuestion($id: ID!) {
  deleteQuizQuestion(id: $id)
}

# User mutations
mutation StartQuiz($quizId: ID!) {
  startQuiz(quizId: $quizId) {
    id
    startedAt
    expiresAt
    isExpired
    questionOrder
    orderedQuestions {
      __typename
      id
      questionText
      questionOrder
      timeoutSeconds
      ... on PredefinedQuestion {
        allowMultipleSelection
        predefinedAnswers {
          id
          answerText
          answerOrder
          isCorrect
        }
      }
      ... on NumberQuestion {
        minValue
        maxValue
        stepValue
      }
    }
    quiz {
      id
      name
      timeoutSeconds
    }
  }
}

mutation SubmitQuizAnswer($submissionId: ID!, $input: SubmitQuizAnswerInput!) {
  submitQuizAnswer(submissionId: $submissionId, input: $input) {
    __typename
    id
    answeredAt
    timeSpentSeconds
    question {
      id
    }
    ... on PredefinedResponse {
      isCorrect
      selectedAnswerIds
      selectedAnswers {
        id
        answerText
        isCorrect
      }
    }
  }
}

mutation FinalizeQuiz($submissionId: ID!) {
  finalizeQuiz(submissionId: $submissionId) {
    id
    completedAt
    score
    maxScore
    scorePercentage
    pointsAwarded
  }
}
