mutation FinishQuizSession($id: ID!) {
  finishQuizSession(id: $id) {
    id
    name
    state
    openAt
    lockAt
    finishAt
    createdAt
    accessCount
    quiz {
      id
      name
    }
    createdBy {
      id
      name
    }
  }
