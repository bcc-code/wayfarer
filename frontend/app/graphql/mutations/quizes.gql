mutation ReopenQuizSession($id: ID!) {
  reopenQuizSession(id: $id) {
    id
    name
    state
    openAt
    lockAt
    finishAt
    createdAt
    accessCount
    quiz {
      id
      name
    }
    createdBy {
      id
      name
    }
  }
