# Admin mutations
mutation CreateQuiz($input: CreateQuizInput!) {
  createQuiz(input: $input) {
    id
    name
  }
}

mutation UpdateQuiz($id: ID!, $input: UpdateQuizInput!) {
  updateQuiz(id: $id, input: $input) {
    id
    name
  }
}

mutation AddQuizQuestion($quizId: ID!, $input: CreateQuizQuestionInput!) {
  addQuizQuestion(quizId: $quizId, input: $input) {
    ...QuizQuestionFields
  }
}

mutation UpdateQuizQuestion($id: ID!, $input: UpdateQuizQuestionInput!) {
  updateQuizQuestion(id: $id, input: $input) {
    ...QuizQuestionFields
  }
}

mutation DeleteQuizQuestion($id: ID!) {
  deleteQuizQuestion(id: $id)
}

mutation UpdateQuizSession($id: ID!, $input: UpdateQuizSessionInput!) {
  updateQuizSession(id: $id, input: $input) {
    id
    name
    state
    openAt
    lockAt
    finishAt
    createdAt
    accessCount
    createdBy {
      id
      name
    }
  }
}

mutation DeleteQuizSession($id: ID!) {
  deleteQuizSession(id: $id)
}

mutation CreateQuizSession($input: CreateQuizSessionInput!) {
  createQuizSession(input: $input) {
    id
    name
    state
    openAt
    lockAt
    finishAt
    createdAt
    quiz {
      id
      name
    }
  }
}

mutation OpenQuizSession($id: ID!) {
  openQuizSession(id: $id) {
    id
    name
    state
    openAt
    lockAt
    finishAt
    createdAt
    accessCount
    quiz {
      id
      name
    }
    createdBy {
      id
      name
    }
  }
}

mutation GrantQuizSessionAccess($input: GrantQuizSessionAccessInput!) {
  grantQuizSessionAccess(input: $input)
}

mutation GrantQuizSessionAccessAsync($input: GrantQuizSessionAccessInput!) {
  grantQuizSessionAccessAsync(input: $input) {
    id
    operationType
    status
    totalCount
  }
}

mutation LockQuizSession($id: ID!) {
  lockQuizSession(id: $id) {
    id
    name
    state
    openAt
    lockAt
    finishAt
    createdAt
    accessCount
    quiz {
      id
      name
    }
    createdBy {
      id
      name
    }
  }
