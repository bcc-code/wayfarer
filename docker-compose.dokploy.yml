# Dokploy deployment for Interact (Wayfarer) — the self-hosted equivalent of
# cloudbuild.yaml. Create a "Compose" service in Dokploy pointing at this
# repo and file; set the variables from .env.dokploy.example in Dokploy's
# Environment tab.
#
# Differences from the Cloud Run pipeline:
# - No static-files bucket sync: the Go server serves /static itself.
# - No separate "-jobs" service: it was the same image deployed twice to
#   isolate Cloud Scheduler traffic. The scheduler endpoints
#   (/api/scheduler/..., see backend/cmd/server/main.go) exist on this
#   service; trigger them with an external cron if needed.

services:
  interact:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # Baked into the Nuxt build at image-build time (public config).
        NUXT_PUBLIC_API_URL: ${NUXT_PUBLIC_API_URL}
        NUXT_PUBLIC_TOKEN_URL: ${NUXT_PUBLIC_TOKEN_URL}
        NUXT_PUBLIC_AUTH0_DOMAIN: ${NUXT_PUBLIC_AUTH0_DOMAIN:-login.bcc.no}
        NUXT_PUBLIC_AUTH0_CLIENT_ID: ${NUXT_PUBLIC_AUTH0_CLIENT_ID}
        NUXT_PUBLIC_AUTH0_AUDIENCE: ${NUXT_PUBLIC_AUTH0_AUDIENCE}
        NUXT_PUBLIC_RUDDERSTACK_WRITE_KEY: ${NUXT_PUBLIC_RUDDERSTACK_WRITE_KEY}
        NUXT_PUBLIC_RUDDERSTACK_DATA_PLANE_URL: ${NUXT_PUBLIC_RUDDERSTACK_DATA_PLANE_URL}
        NUXT_PUBLIC_VAPID_PUBLIC_KEY: ${NUXT_PUBLIC_VAPID_PUBLIC_KEY}
        NUXT_PUBLIC_IS_STAGING: ${NUXT_PUBLIC_IS_STAGING:-true}
        NUXT_PUBLIC_FIREBASE_DATABASE: ${NUXT_PUBLIC_FIREBASE_DATABASE}
        NUXT_PUBLIC_FIREBASE_API_KEY: ${NUXT_PUBLIC_FIREBASE_API_KEY}
        NUXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ${NUXT_PUBLIC_FIREBASE_AUTH_DOMAIN}
        NUXT_PUBLIC_FIREBASE_PROJECT_ID: ${NUXT_PUBLIC_FIREBASE_PROJECT_ID}
        APP_VERSION: ${APP_VERSION:-dokploy}
    restart: unless-stopped
    # Runtime env: everything non-public lives in Dokploy's Environment tab
    # and is passed straight through (see .env.dokploy.example).
    env_file:
      - .env
    extra_hosts:
      # Host-level PostgreSQL (the ansible-provisioned one)
      - host.docker.internal:host-gateway
    volumes:
      # Load-test scratch dir: HTTP_STATS_FILE (windowed JSONL dumps) writes
      # here; mounting from the host keeps stats across redeploys and readable
      # without entering the container. Docker creates the dir if missing.
      - /opt/wayfarer:/opt/wayfarer
    networks:
      - dokploy-network
    labels:
      - traefik.enable=true
      - traefik.http.routers.interact.rule=Host(`${INTERACT_DOMAIN:-interact-test.bcc.media}`)
      - traefik.http.routers.interact.entrypoints=websecure
      - traefik.http.routers.interact.tls.certresolver=letsencrypt
      - traefik.http.services.interact.loadbalancer.server.port=8080
      # HTTP -> HTTPS
      - traefik.http.routers.interact-http.rule=Host(`${INTERACT_DOMAIN:-interact-test.bcc.media}`)
      - traefik.http.routers.interact-http.entrypoints=web
      - traefik.http.routers.interact-http.middlewares=interact-redirect
      - traefik.http.middlewares.interact-redirect.redirectscheme.scheme=https
      # Production domain (interact.bcc.no): served with the manually issued
      # DNS-01 cert in /etc/dokploy/traefik/dynamic/certificates — deliberately
      # NO certresolver here, since HTTP-01 can't succeed until DNS cuts over.
      - traefik.http.routers.interact-prod.rule=Host(`${INTERACT_PROD_DOMAIN:-interact.bcc.no}`)
      - traefik.http.routers.interact-prod.entrypoints=websecure
      - traefik.http.routers.interact-prod.tls=true
      - traefik.http.routers.interact-prod-http.rule=Host(`${INTERACT_PROD_DOMAIN:-interact.bcc.no}`)
      - traefik.http.routers.interact-prod-http.entrypoints=web
      - traefik.http.routers.interact-prod-http.middlewares=interact-redirect

networks:
  dokploy-network:
    external: true
