# User API GraphQL schema
schema:
  - ../gql/shared.graphqls
  - ../gql/user.graphqls

# Generated code locations
exec:
  filename: internal/graph/user/generated.go
  package: user

model:
  filename: internal/graph/user/model/models_gen.go
  package: model

resolver:
  layout: follow-schema
  dir: internal/graph/user
  package: user
  filename_template: "{name}.resolvers.go"

# Custom scalar type mappings
models:
  ID:
    model:
      - github.com/99designs/gqlgen/graphql.ID
  DateTime:
    model:
      - github.com/bcc-media/wayfarer/internal/graph/scalars.DateTime
  Date:
    model:
      - github.com/bcc-media/wayfarer/internal/graph/scalars.Date
  HTML:
    model:
      - github.com/bcc-media/wayfarer/internal/graph/scalars.HTML
  Upload:
    model:
      - github.com/99designs/gqlgen/graphql.Upload

# Autobind - automatically bind Go types to GraphQL types if they match by name
# This helps reduce manual configuration
autobind:
  - github.com/bcc-media/wayfarer/internal/graph/user/model

# Omit generation of unused types and inputs
omit_slice_element_pointers: true
