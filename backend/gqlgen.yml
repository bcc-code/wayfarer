# GraphQL API schema
schema:
  - ../gql/shared.graphqls
  - ../gql/schema.graphqls
  - ../gql/projects.graphqls
  - ../gql/events.graphqls
  - ../gql/teams.graphqls
  - ../gql/achievements.graphqls
  - ../gql/challenges.graphqls
  - ../gql/streaks.graphqls
  - ../gql/users.graphqls
  - ../gql/roles.graphqls
  - ../gql/churches.graphqls
  - ../gql/scoring.graphqls

# Generated code locations
exec:
  filename: internal/graph/api/generated.go
  package: api

model:
  filename: internal/graph/api/model/models_gen.go
  package: model

resolver:
  layout: follow-schema
  dir: internal/graph/api
  package: api
  filename_template: "{name}.resolvers.go"

# Custom scalar type mappings
models:
  ID:
    model:
      - github.com/99designs/gqlgen/graphql.ID
  DateTime:
    model:
      - github.com/bcc-media/wayfarer/internal/graph/scalars.DateTime
  Date:
    model:
      - github.com/bcc-media/wayfarer/internal/graph/scalars.Date
  HTML:
    model:
      - github.com/bcc-media/wayfarer/internal/graph/scalars.HTML
  Upload:
    model:
      - github.com/99designs/gqlgen/graphql.Upload

  MarkdownText:
    model:
      - github.com/bcc-media/wayfarer/internal/graph/api/model.MarkdownText
    fields:
      html:
        resolver: true

  Project:
    fields:
      rules:
        resolver: true
    extraFields:
      RulesRaw:
        type: "*string"

  # Add ProjectID field to types that have project relationships
  Challenge:
    fields:
      project:
        resolver: true
      event:
        resolver: true
    extraFields:
      ProjectID:
        type: string
      EventID:
        type: "*string"

  Event:
    fields:
      parentProject:
        resolver: true
    extraFields:
      ProjectID:
        type: string

  Team:
    fields:
      parentProject:
        resolver: true
      superTeam:
        resolver: true
    extraFields:
      ProjectID:
        type: string
      SuperTeamID:
        type: "*string"

  TeamMember:
    fields:
      user:
        resolver: true
      church:
        resolver: true
    extraFields:
      UserID:
        type: string
      ChurchID:
        type: string

  SuperTeam:
    fields:
      parentProject:
        resolver: true
    extraFields:
      ProjectID:
        type: string

  Streak:
    fields:
      project:
        resolver: true
    extraFields:
      ProjectID:
        type: string

  SimpleAchievement:
    fields:
      project:
        resolver: true
      event:
        resolver: true
      challenge:
        resolver: true
      achievedAt:
        resolver: true
    extraFields:
      ProjectID:
        type: string
      EventID:
        type: "*string"
      ChallengeID:
        type: "*string"

  ReadingAchievement:
    fields:
      project:
        resolver: true
      event:
        resolver: true
      challenge:
        resolver: true
      achievedAt:
        resolver: true
    extraFields:
      ProjectID:
        type: string
      EventID:
        type: "*string"
      ChallengeID:
        type: "*string"

  ListeningAchievement:
    fields:
      project:
        resolver: true
      event:
        resolver: true
      challenge:
        resolver: true
      achievedAt:
        resolver: true
    extraFields:
      ProjectID:
        type: string
      EventID:
        type: "*string"
      ChallengeID:
        type: "*string"

  StreakAchievement:
    fields:
      project:
        resolver: true
      event:
        resolver: true
      challenge:
        resolver: true
      streak:
        resolver: true
      achievedAt:
        resolver: true
    extraFields:
      ProjectID:
        type: string
      EventID:
        type: "*string"
      ChallengeID:
        type: "*string"
      StreakID:
        type: string

  ScoreJournal:
    fields:
      project:
        resolver: true
      user:
        resolver: true
      event:
        resolver: true
      challenge:
        resolver: true
      source:
        resolver: true
      awardedBy:
        resolver: true
    extraFields:
      ProjectID:
        type: string
      UserID:
        type: string
      EventID:
        type: "*string"
      ChallengeID:
        type: "*string"
      SourceID:
        type: "*string"
      AwardedByID:
        type: "*string"

# Autobind - automatically bind Go types to GraphQL types if they match by name
autobind:
  - github.com/bcc-media/wayfarer/internal/graph/api/model

# Directive configuration
directives:
  requireRole:
    skip_runtime: false

# Omit generation of unused types and inputs
omit_slice_element_pointers: true
