version: v1.0
name: Wayfarer CI
agent:
  machine:
    type: e2-standard-2
    os_image: ubuntu2204

auto_cancel:
  running:
    when: "branch != 'main'"

global_job_config:
  secrets:
    - name: ghcr-credentials
    - name: aws-credentials
    - name: nuxt-env-vars
  env_vars:
    - name: DOCKER_BUILDKIT
      value: "1"

blocks:
  - name: Change Detection
    dependencies: []
    task:
      jobs:
        - name: Detect Changes
          commands:
            - checkout
            - |
              # Get changed files
              if [ "$SEMAPHORE_GIT_PR_BRANCH" != "" ]; then
                BASE_SHA=$(git merge-base origin/main HEAD)
              else
                BASE_SHA="${SEMAPHORE_GIT_COMMIT_RANGE%%..*}"
              fi

              # Initialize change flags
              BACKEND_CHANGED=false
              FRONTEND_CHANGED=false

              # Check for backend changes
              if git diff --name-only $BASE_SHA HEAD | grep -qE '^backend/'; then
                BACKEND_CHANGED=true
              fi

              # Check for frontend changes
              if git diff --name-only $BASE_SHA HEAD | grep -qE '^frontend/'; then
                FRONTEND_CHANGED=true
              fi

              # Check for Dockerfile.backend changes (triggers backend rebuild)
              if git diff --name-only $BASE_SHA HEAD | grep -qE '^Dockerfile\.backend'; then
                BACKEND_CHANGED=true
              fi

              # Write to artifact
              echo "BACKEND_CHANGED=$BACKEND_CHANGED" >> changes.env
              echo "FRONTEND_CHANGED=$FRONTEND_CHANGED" >> changes.env
              echo "COMMIT_SHA=$SEMAPHORE_GIT_SHA" >> changes.env

              cat changes.env
            - artifact push workflow changes.env

  - name: Build Backend
    dependencies: ["Change Detection"]
    run:
      when: "change_in('/backend/', {default_branch: 'main'}) or change_in('/Dockerfile.backend', {default_branch: 'main'})"
    task:
      prologue:
        commands:
          - checkout
          - cache restore go-mod-$(checksum backend/go.sum)
      jobs:
        - name: Build and Push Image
          commands:
            - cd backend
            - go mod download
            - cache store go-mod-$(checksum go.sum) ~/go/pkg/mod
            - cd ..
            - echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USERNAME" --password-stdin
            - |
              docker build \
                --cache-from ghcr.io/bcc-code/wayfarer:latest \
                --build-arg BUILDKIT_INLINE_CACHE=1 \
                -t ghcr.io/bcc-code/wayfarer:$SEMAPHORE_GIT_SHA \
                -t ghcr.io/bcc-code/wayfarer:latest \
                -f Dockerfile.backend .
            - docker push ghcr.io/bcc-code/wayfarer:$SEMAPHORE_GIT_SHA
            - docker push ghcr.io/bcc-code/wayfarer:latest

  - name: Build Frontend
    dependencies: ["Change Detection"]
    run:
      when: "change_in('/frontend/', {default_branch: 'main'})"
    task:
      prologue:
        commands:
          - checkout
          - sem-version node 22
          - corepack enable && corepack prepare pnpm@latest --activate
          - cache restore pnpm-$(checksum frontend/pnpm-lock.yaml)
      jobs:
        - name: Build and Upload to S3
          commands:
            - cd frontend
            - pnpm install --frozen-lockfile
            - cache store pnpm-$(checksum pnpm-lock.yaml) node_modules
            - pnpm run build
            # Upload immutable assets with long cache
            - |
              aws s3 sync .output/public/ s3://wayfarer-frontend-dev/ \
                --delete \
                --cache-control "public, max-age=31536000, immutable" \
                --exclude "*.html" \
                --exclude "sw.js" \
                --exclude "manifest.webmanifest"
            # Upload HTML and service worker with no-cache
            - |
              aws s3 sync .output/public/ s3://wayfarer-frontend-dev/ \
                --cache-control "public, max-age=0, must-revalidate" \
                --include "*.html" \
                --include "sw.js" \
                --include "manifest.webmanifest"
            # Store build artifact for PROD deployment
            - artifact push workflow .output/public frontend-build

  - name: Test Backend
    dependencies: ["Change Detection"]
    run:
      when: "change_in('/backend/', {default_branch: 'main'})"
    task:
      prologue:
        commands:
          - checkout
          - cache restore go-mod-$(checksum backend/go.sum)
      jobs:
        - name: Unit Tests
          commands:
            - cd backend
            - go mod download
            - go test -v -race ./...

  - name: Test Frontend
    dependencies: ["Change Detection"]
    run:
      when: "change_in('/frontend/', {default_branch: 'main'})"
    task:
      prologue:
        commands:
          - checkout
          - sem-version node 22
          - corepack enable && corepack prepare pnpm@latest --activate
          - cache restore pnpm-$(checksum frontend/pnpm-lock.yaml)
      jobs:
        - name: Unit Tests
          commands:
            - cd frontend
            - pnpm install --frozen-lockfile
            - pnpm test:unit

promotions:
  - name: Deploy to DEV
    pipeline_file: deploy-dev.yml
    auto_promote:
      when: "result = 'passed' and branch = 'main'"

  - name: Deploy to PROD
    pipeline_file: deploy-prod.yml
